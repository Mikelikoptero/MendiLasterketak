<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mendi Lasterketen Egutegia</title>
  <style>
    :root {
      /* 🎨 PALETA BEIGE Y TONOS DE MONTAÑA */
      --bg-color: #f5f2eb;
      --card-bg: #faf7f2;
      --sidebar-width: 550px;
      --primary-color: #2b3036;
      --accent-color: #8c6d58;
      --border-color: #dcd6cd;
      
      --map-base-color: #c4d7c1;
      --map-hover-color: #5b8e7d;
      --map-border-color: #2b3036;
      --instagram-color: #c13584;
    }

    @media (min-width: 1400px) {
      :root {
        --sidebar-width: 650px;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: #2c302e;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Goiburua */
    .header {
      padding: 0.5rem 1.5rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      z-index: 30;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 1.5rem;
      position: relative;
    }

    .header h1 {
      font-size: 1.2rem;
      color: var(--primary-color);
      white-space: nowrap;
      letter-spacing: -0.3px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: relative;
    }

    .view-toggle {
      display: flex;
      background: var(--bg-color);
      padding: 2px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .toggle-btn {
      border: none;
      background: none;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
      color: #6a665e;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary-color);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    /* Layout principal */
    .app-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      overflow-y: auto;
      height: 100%;
      gap: 1rem;
    }

    /* Buscador */
    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 650px;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      outline: none;
      background: var(--card-bg);
      color: #2c302e;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    /* Vista Mapa */
    .map-container {
      display: none;
      background: var(--card-bg);
      padding: 0.75rem;
      border-radius: 3px;
      border: 1px solid var(--border-color);
      justify-content: center;
      align-items: center;
      width: fit-content;
      max-width: 100%;
    }

    .map-container svg {
      width: auto;
      height: auto;
      max-width: calc(100vw - var(--sidebar-width) - 5rem);
      max-height: calc(100vh - 180px);
      display: block;
    }

    /* Vista Lista */
    .list-container {
      display: none;
      width: 100%;
      max-width: 650px;
      height: 100%;
      max-height: calc(100vh - 180px);
      background: var(--card-bg);
      padding: 1.25rem;
      border-radius: 3px;
      border: 1px solid var(--border-color);
      flex-direction: column;
    }

    .list-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .province-select {
      padding: 5px 10px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      outline: none;
      color: var(--primary-color);
      background: var(--bg-color);
      cursor: pointer;
    }

    .udalerri-ul {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding-right: 5px;
    }

    .udalerri-li {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      font-weight: 500;
      color: #3f4440;
      transition: background 0.15s, color 0.15s;
      border-radius: 2px;
    }

    .udalerri-li:hover {
      background-color: var(--bg-color);
      color: var(--primary-color);
    }

    /* 🗓️ Vista Egutegia Matriz Visual (Inicia activa) */
    .calendar-container {
      display: flex;
      width: 100%;
      max-width: 650px;
      height: 100%;
      max-height: calc(100vh - 180px);
      background: var(--card-bg);
      padding: 1.25rem;
      border-radius: 3px;
      border: 1px solid var(--border-color);
      flex-direction: column;
      overflow-y: auto;
    }

    .calendar-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--bg-color);
    }

    .calendar-toolbar h3 {
      font-size: 1.05rem;
      color: var(--primary-color);
      font-weight: 700;
    }

    .year-select {
      padding: 6px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      outline: none;
      color: var(--primary-color);
      background: var(--bg-color);
      cursor: pointer;
    }

    .months-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .month-block {
      border: 1px solid var(--border-color);
      border-radius: 3px;
      overflow: hidden;
      background: var(--card-bg);
    }

    .month-header {
      background: var(--primary-color);
      color: #f5f2eb;
      padding: 7px 14px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .month-races {
      display: flex;
      flex-direction: column;
    }

    .calendar-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background 0.15s ease;
      gap: 12px;
    }

    .calendar-item:last-child {
      border-bottom: none;
    }

    .calendar-item:hover {
      background: var(--bg-color);
    }

    .date-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-color);
      color: var(--accent-color);
      border-radius: 3px;
      min-width: 55px;
      padding: 4px 6px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .date-badge .day-num {
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1;
    }

    .date-badge .month-name {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 2px;
      color: #8c7f73;
    }

    .race-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .race-title {
      font-weight: 700;
      color: var(--primary-color);
      font-size: 0.95rem;
    }

    .race-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .race-town-tag {
      font-size: 0.7rem;
      font-weight: 700;
      background: var(--bg-color);
      color: #5c554c;
      padding: 2px 7px;
      border-radius: 2px;
      border: 1px solid var(--border-color);
    }

    .calendar-empty {
      text-align: center;
      color: #8c7f73;
      padding: 3rem 1rem;
      font-style: italic;
    }

    /* Estilos SVG */
    .map-container svg path, 
    .map-container svg polygon {
      fill: var(--map-base-color) !important;
      stroke: var(--map-border-color) !important;
      stroke-width: 1px !important;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      paint-order: stroke fill;
      cursor: pointer !important;
      pointer-events: visiblePainted !important;
      transition: fill 0.2s ease, stroke-width 0.2s ease;
    }

    .map-container svg g {
      fill: none;
      stroke: none;
    }

    .map-container svg path:hover, 
    .map-container svg polygon:hover {
      fill: var(--map-hover-color) !important;
      stroke-width: 2px !important;
    }

    /* Panel Fijo Lateral */
    .sidebar-fixed {
      width: var(--sidebar-width);
      height: 100%;
      background-color: var(--card-bg);
      border-left: 1px solid var(--border-color);
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      z-index: 20;
      overflow-y: auto;
    }

    .sidebar-header {
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }

    .sidebar-header h2 {
      font-size: 1.7rem;
      color: var(--primary-color);
      font-weight: 700;
      word-break: break-word;
    }

    .sidebar-content {
      color: #4a453f;
      line-height: 1.6;
      font-size: 1.05rem;
    }

    .sidebar-content h3 {
      font-size: 1.2rem;
      margin: 1.2rem 0 0.6rem 0;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .race-link {
      color: var(--accent-color);
      text-decoration: none;
      transition: color 0.2s ease;
      display: inline-block;
      font-weight: 600;
    }

    .race-link:hover {
      color: var(--instagram-color);
      text-decoration: underline;
    }

    /* 📋 Lista de años/ediciones con sangría y flecha */
    .sidebar-content ul {
      list-style: none;
      margin-left: 0;
      margin-bottom: 1rem;
      padding-left: 1.6rem;
    }

    .sidebar-content ul li {
      position: relative;
      padding-left: 1rem;
      margin-bottom: 0.25rem;
    }

    .sidebar-content ul li::before {
      content: "→";
      position: absolute;
      left: 0;
      top: 0;
      color: var(--accent-color);
      font-size: 0.8rem;
      line-height: 1.6;
      font-weight: 700;
    }

    /* 🥾 Botones Track e Instagram (misma estética, tamaño reducido) */
    .track-btn,
    .instagram-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px 3px 7px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: var(--accent-color);
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      vertical-align: middle;
      line-height: 1;
      flex-shrink: 0;
    }

    .track-btn:hover {
      background: var(--accent-color);
      color: #faf7f2;
      border-color: var(--accent-color);
      text-decoration: none;
    }

    .instagram-btn:hover {
      background: var(--instagram-color);
      color: #faf7f2;
      border-color: var(--instagram-color);
      text-decoration: none;
    }

    .track-btn img,
    .instagram-btn img {
      width: 14px;
      height: 14px;
      display: block;
      object-fit: contain;
      transition: filter 0.15s ease;
    }

    .track-btn:hover img {
      filter: brightness(0) invert(1);
    }

    /* Tooltip */
    .map-tooltip {
      position: fixed;
      background-color: rgba(43, 48, 54, 0.92);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 3px;
      font-size: 0.85rem;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 1000;
      white-space: nowrap;
    }

    .map-tooltip.visible {
      opacity: 1;
    }

    /* 📱 Adaptación móvil */
    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }

      .header {
        height: auto;
        padding: 0.75rem;
        flex-direction: row;
        justify-content: space-between;
      }

      .app-layout {
        flex-direction: column;
        height: auto;
        overflow: visible;
        padding: 0.75rem;
        gap: 1rem;
      }

      .sidebar-fixed {
        order: 1;
        width: 100%;
        height: auto;
        border-left: none;
        border: 1px solid var(--border-color);
        border-radius: 3px;
        padding: 1.25rem;
      }

      .main-area {
        order: 2;
        padding: 0;
        width: 100%;
        height: auto;
        gap: 1rem;
      }

      .search-wrapper {
        order: 1;
        width: 100%;
      }

      .map-container {
        order: 2;
        width: 100%;
      }

      .map-container svg {
        max-width: 100%;
        max-height: 45vh;
      }

      .list-container,
      .calendar-container {
        order: 2;
        width: 100%;
        max-height: 50vh;
        border: 1px solid var(--border-color);
      }
    }
  </style>
</head>

    function addRaceButtons() {
      const h3List = sidebarContent.querySelectorAll('h3');
      h3List.forEach(h3 => {
        if (h3.querySelector('.track-btn') || h3.querySelector('.instagram-btn')) return;

        const trackUrl = h3.getAttribute('data-track');
        const instaUrl = h3.getAttribute('data-instagram');

        if (trackUrl && trackUrl.trim() !== "") {
          const trackBtn = document.createElement('a');
          trackBtn.href = trackUrl;
          trackBtn.target = '_blank';
          trackBtn.rel = 'noopener noreferrer';
          trackBtn.className = 'track-btn';
          trackBtn.innerHTML = `
            <img src="TrackLogo.svg" alt="Track">
            <span>Track</span>
          `;
          h3.appendChild(trackBtn);
        }

        if (instaUrl && instaUrl.trim() !== "") {
          const instaBtn = document.createElement('a');
          instaBtn.href = instaUrl;
          instaBtn.target = '_blank';
          instaBtn.rel = 'noopener noreferrer';
          instaBtn.className = 'instagram-btn';
          instaBtn.innerHTML = `
            <img src="InstagramLogo.png" alt="Instagram">
            <span>Instagram</span>
          `;
          h3.appendChild(instaBtn);
        }
      });
    }

    function selectUdalerria(rawId) {
      if (udalerriDatuak[rawId]) {
        sidebarTitle.textContent = udalerriDatuak[rawId].titulua;
        sidebarContent.innerHTML = udalerriDatuak[rawId].edukia || `<p>Ez dago informazio gehigarririk sartuta.</p>`;
        addRaceButtons();
      } else {
        sidebarTitle.textContent = rawId;
        sidebarContent.innerHTML = `<p>Ez dago informazio gehigarririk sartuta.</p>`;
      }
    }

    // Cargar SVG
    fetch('mapa.svg')
      .then(response => {
        if (!response.ok) throw new Error('Ez da mapa.svg aurkitu');
        return response.text();
      })
      .then(svgData => {
        mapContainer.innerHTML = svgData;

        const regions = mapContainer.querySelectorAll('path, polygon');

        regions.forEach((region, index) => {
          const rawId = region.getAttribute('data-name') || 
                        region.getAttribute('name') || 
                        region.getAttribute('id') || 
                        `Udalerria ${index + 1}`;

          region.addEventListener('mousemove', (e) => {
            const data = udalerriDatuak[rawId];
            tooltip.textContent = data ? data.titulua : rawId;
            tooltip.style.left = `${e.clientX + 12}px`;
            tooltip.style.top = `${e.clientY + 12}px`;
            tooltip.classList.add('visible');
          });

          region.addEventListener('mouseleave', () => {
            tooltip.classList.remove('visible');
          });

          region.addEventListener('click', (e) => {
            e.stopPropagation();
            selectUdalerria(rawId);
          });
        });
      })
      .catch(error => {
        console.error(error);
        mapContainer.innerHTML = `<p style="color:red;">Errorea mapa.svg kargatzean.</p>`;
      });

    // Renderizar Lista filtrada por provincia y buscador
    function renderList(filter = "", province = "Gipuzkoa") {
      udalerriUl.innerHTML = "";
      const sortedKeys = Object.keys(udalerriDatuak).sort((a, b) => a.localeCompare(b));

      sortedKeys.forEach(key => {
        const item = udalerriDatuak[key];
        const matchesProvince = item.province === province;
        const matchesSearch = item.titulua.toLowerCase().includes(filter.toLowerCase());

        if (matchesProvince && matchesSearch) {
          const li = document.createElement('li');
          li.className = 'udalerri-li';
          li.textContent = item.titulua;
          li.addEventListener('click', (e) => {
            e.stopPropagation();
            selectUdalerria(key);
          });
          udalerriUl.appendChild(li);
        }
      });
    }

    /* 🗓️ EGUTEGIA MATRIZ / MESES PARSER */
    const monthNames = {
      1: "Urtarrila", 2: "Otsaila", 3: "Martxoa", 4: "Apirila",
      5: "Maiatza", 6: "Ekaina", 7: "Uztaila", 8: "Abuztua",
      9: "Iraila", 10: "Urria", 11: "Azaroa", 12: "Abendua"
    };

    const monthShortNames = {
      1: "Urt", 2: "Ots", 3: "Mar", 4: "Api",
      5: "Mai", 6: "Eka", 7: "Uzt", 8: "Abu",
      9: "Ira", 10: "Urr", 11: "Aza", 12: "Abe"
    };

    const hilabeteak = {
      "urtarrilak": 1, "urtarrila": 1,
      "otsailak": 2, "otsaila": 2,
      "martxoak": 3, "martxoa": 3,
      "apirilak": 4, "apirila": 4,
      "maiatzak": 5, "maiatza": 5,
      "ekainak": 6, "ekaina": 6,
      "uztailak": 7, "uztaila": 7,
      "abuztuak": 8, "abuztua": 8,
      "irailak": 9, "iraila": 9,
      "urriak": 10, "urria": 10,
      "azaroak": 11, "azaroa": 11,
      "abenduak": 12, "abendua": 12
    };

    function parseRacesFromData() {
      const races = [];
      const tempDiv = document.createElement('div');

      Object.keys(udalerriDatuak).forEach(key => {
        const townData = udalerriDatuak[key];
        if (!townData.edukia) return;

        tempDiv.innerHTML = townData.edukia;
        const h3List = tempDiv.querySelectorAll('h3');

        h3List.forEach(h3 => {
          const raceName = h3.textContent.trim();
          const ul = h3.nextElementSibling;

          if (ul && ul.tagName.toLowerCase() === 'ul') {
            const liList = ul.querySelectorAll('li');
            liList.forEach(li => {
              const text = li.innerText || li.textContent;
              const match = text.match(/(\d{4})(?:\s*\(([^)]+)\))?:\s*(.+)/);
              if (match) {
                const year = match[1];
                const edition = match[2] || '';
                const dateStr = match[3].trim();

                if (dateStr && dateStr !== '-') {
                  let day = 0;
                  let monthNum = 0;

                  const words = dateStr.toLowerCase().split(/\s+/);
                  words.forEach(w => {
                    const num = parseInt(w, 10);
                    if (!isNaN(num) && num <= 31) {
                      day = num;
                    } else if (hilabeteak[w]) {
                      monthNum = hilabeteak[w];
                    }
                  });

                  races.push({
                    townKey: key,
                    townTitle: townData.titulua,
                    raceName: raceName,
                    year: year,
                    edition: edition,
                    dateStr: dateStr,
                    monthNum: monthNum,
                    day: day
                  });
                }
              }
            });
          }
        });
      });

      return races;
    }

    function renderCalendarGrid(filter = "", selectedYear = "2027") {
      calendarGrid.innerHTML = "";
      const allRaces = parseRacesFromData();

      const filteredRaces = allRaces.filter(r => {
        const matchesYear = r.year === selectedYear;
        const matchesSearch = filter === "" || 
                              r.raceName.toLowerCase().includes(filter.toLowerCase()) || 
                              r.townTitle.toLowerCase().includes(filter.toLowerCase());
        return matchesYear && matchesSearch;
      });

      if (filteredRaces.length === 0) {
        calendarGrid.innerHTML = `<div class="calendar-empty">Ez dago lasterketarik baieztatuta ${selectedYear} urterako.</div>`;
        return;
      }

      const racesByMonth = {};
      filteredRaces.forEach(r => {
        const m = r.monthNum || 0;
        if (!racesByMonth[m]) racesByMonth[m] = [];
        racesByMonth[m].push(r);
      });

      const sortedMonths = Object.keys(racesByMonth).map(Number).sort((a,b) => a - b);

      sortedMonths.forEach(mNum => {
        const monthBlock = document.createElement('div');
        monthBlock.className = 'month-block';

        const monthTitle = monthNames[mNum] || "Beste batzuk";
        
        let racesHtml = '';
        const mRaces = racesByMonth[mNum].sort((a,b) => a.day - b.day);

        mRaces.forEach(r => {
          racesHtml += `
            <div class="calendar-item" onclick="selectUdalerria('${r.townKey}')">
              <div class="date-badge">
                <span class="day-num">${r.day || '--'}</span>
                <span class="month-name">${monthShortNames[r.monthNum] || ''}</span>
              </div>
              <div class="race-info">
                <span class="race-title">${r.raceName} ${r.edition ? `(${r.edition})` : ''}</span>
                <div class="race-meta">
                  <span class="race-town-tag">${r.townTitle}</span>
                </div>
              </div>
            </div>
          `;
        });

        monthBlock.innerHTML = `
          <div class="month-header">${monthTitle}</div>
          <div class="month-races">${racesHtml}</div>
        `;

        calendarGrid.appendChild(monthBlock);
      });
    }

    // Buscador en tiempo real
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value;
      renderList(term, provinceSelect.value);
      renderCalendarGrid(term, yearSelect.value);

      if (term.trim() !== "") {
        const matchKey = Object.keys(udalerriDatuak).find(k => 
          udalerriDatuak[k].titulua.toLowerCase().includes(term.toLowerCase())
        );
        if (matchKey) {
          selectUdalerria(matchKey);
        }
      }
    });

    yearSelect.addEventListener('change', (e) => {
      renderCalendarGrid(searchInput.value, e.target.value);
    });

    provinceSelect.addEventListener('change', (e) => {
      renderList(searchInput.value, e.target.value);
    });

    renderList(searchInput.value, provinceSelect.value);
    renderCalendarGrid(searchInput.value, yearSelect.value);

    // Toggle entre Vistas
    btnMap.addEventListener('click', () => {
      btnMap.classList.add('active');
      btnList.classList.remove('active');
      btnCalendar.classList.remove('active');

      mapContainer.style.display = 'flex';
      listContainer.style.display = 'none';
      calendarContainer.style.display = 'none';
    });

    btnList.addEventListener('click', () => {
      btnList.classList.add('active');
      btnMap.classList.remove('active');
      btnCalendar.classList.remove('active');

      mapContainer.style.display = 'none';
      listContainer.style.display = 'flex';
      calendarContainer.style.display = 'none';
    });

    btnCalendar.addEventListener('click', () => {
      btnCalendar.classList.add('active');
      btnMap.classList.remove('active');
      btnList.classList.remove('active');

      mapContainer.style.display = 'none';
      listContainer.style.display = 'none';
      calendarContainer.style.display = 'flex';

      renderCalendarGrid(searchInput.value, yearSelect.value);
    });
