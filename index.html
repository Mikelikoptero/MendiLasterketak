<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mendi Lasterketen Egutegia</title>
  <style>
    :root {
      /* 🎨 PALETA BEIGE Y TONOS DE MONTAÑA */
      --bg-color: #f5f2eb;
      --card-bg: #faf7f2;
      --sidebar-width: 550px;
      --primary-color: #2b3036;
      --accent-color: #8c6d58;
      --border-color: #dcd6cd;
      
      --map-base-color: #c4d7c1;
      --map-hover-color: #5b8e7d;
      --map-border-color: #2b3036;
      --instagram-color: #c13584;

      /* 🎨 COLORES PASTEL PARA MARCAJES */
      --pastel-mikel: #c8e6c9;      /* verde pastel */
      --pastel-mikel-border: #81c784;
      --pastel-luken: #bbdefb;      /* azul pastel */
      --pastel-luken-border: #64b5f6;
      --pastel-both: #f8bbd0;       /* rosa pastel */
      --pastel-both-border: #f06292;
      --pastel-none: #f5f2eb;       /* beige neutro */
      --pastel-none-border: #dcd6cd;
    }

    @media (min-width: 1400px) {
      :root {
        --sidebar-width: 650px;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: #2c302e;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Goiburua */
    .header {
      padding: 0.5rem 1.5rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      z-index: 30;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 1.5rem;
      position: relative;
    }

    .header h1 {
      font-size: 1.2rem;
      color: var(--primary-color);
      white-space: nowrap;
      letter-spacing: -0.3px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: relative;
    }

    .view-toggle {
      display: flex;
      background: var(--bg-color);
      padding: 2px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .toggle-btn {
      border: none;
      background: none;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
      color: #6a665e;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary-color);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    /* Layout principal */
    .app-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      overflow-y: auto;
      height: 100%;
      gap: 1rem;
    }

    /* Buscador */
    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 650px;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      outline: none;
      background: var(--card-bg);
      color: #2c302e;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    /* Vista Mapa */
    .map-container {
      display: none;
      background: var(--card-bg);
      padding: 0.75rem;
      border-radius: 3px;
      border: 1px solid var(--border-color);
      justify-content: center;
      align-items: center;
      width: fit-content;
      max-width: 100%;
    }

    .map-container svg {
      width: auto;
      height: auto;
      max-width: calc(100vw - var(--sidebar-width) - 5rem);
      max-height: calc(100vh - 180px);
      display: block;
    }

    /* Vista Lista */
    .list-container {
      display: none;
      width: 100%;
      max-width: 650px;
      height: 100%;
      max-height: calc(100vh - 180px);
      background: var(--card-bg);
      padding: 1.25rem;
      border-radius: 3px;
      border: 1px solid var(--border-color);
      flex-direction: column;
    }

    .list-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .province-select {
      padding: 5px 10px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      outline: none;
      color: var(--primary-color);
      background: var(--bg-color);
      cursor: pointer;
    }

    .udalerri-ul {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding-right: 5px;
    }

    .udalerri-li {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      font-weight: 500;
      color: #3f4440;
      transition: background 0.15s, color 0.15s;
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .udalerri-li:hover {
      background-color: var(--bg-color);
      color: var(--primary-color);
    }

    .race-item-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--primary-color);
    }

    .race-item-town {
      font-size: 0.7rem;
      font-weight: 700;
      background: var(--bg-color);
      color: #5c554c;
      padding: 2px 7px;
      border-radius: 2px;
      border: 1px solid var(--border-color);
      align-self: flex-start;
    }

    /* 🗓️ Vista Datak (lista por meses) */
    .calendar-container {
      display: none;
      width: 100%;
      max-width: 650px;
      height: 100%;
      max-height: calc(100vh - 180px);
      background: var(--card-bg);
      padding: 1.25rem;
      border-radius: 3px;
      border: 1px solid var(--border-color);
      flex-direction: column;
      overflow-y: auto;
    }

    .calendar-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--bg-color);
    }

    .calendar-toolbar h3 {
      font-size: 1.05rem;
      color: var(--primary-color);
      font-weight: 700;
    }

    .calendar-toolbar-filters {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .year-select,
    .calendar-province-select {
      padding: 6px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      outline: none;
      color: var(--primary-color);
      background: var(--bg-color);
      cursor: pointer;
    }

    .months-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .month-block {
      border: 1px solid var(--border-color);
      border-radius: 3px;
      overflow: hidden;
      background: var(--card-bg);
    }

    .month-header {
      background: var(--primary-color);
      color: #f5f2eb;
      padding: 7px 14px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .month-races {
      display: flex;
      flex-direction: column;
    }

    .calendar-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background 0.15s ease;
      gap: 12px;
    }

    .calendar-item:last-child {
      border-bottom: none;
    }

    .calendar-item:hover {
      background: var(--bg-color);
    }

    .date-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-color);
      color: var(--accent-color);
      border-radius: 3px;
      min-width: 55px;
      padding: 4px 6px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .date-badge .day-num {
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1;
    }

    .date-badge .month-name {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 2px;
      color: #8c7f73;
    }

    .race-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .race-title {
      font-weight: 700;
      color: var(--primary-color);
      font-size: 0.95rem;
    }

    .race-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .race-town-tag {
      font-size: 0.7rem;
      font-weight: 700;
      background: var(--bg-color);
      color: #5c554c;
      padding: 2px 7px;
      border-radius: 2px;
      border: 1px solid var(--border-color);
    }

    .calendar-empty {
      text-align: center;
      color: #8c7f73;
      padding: 3rem 1rem;
      font-style: italic;
    }

    /* 🗓️ Calendario de pared */
    .wall-calendar-container {
      display: none;
      width: 100%;
      max-width: 1100px;
      height: 100%;
      max-height: calc(100vh - 180px);
      background: var(--card-bg);
      padding: 1.25rem;
      border-radius: 3px;
      border: 1px solid var(--border-color);
      flex-direction: column;
      overflow-y: auto;
    }

    .wall-calendar-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--bg-color);
    }

    .wall-calendar-toolbar h3 {
      font-size: 1.05rem;
      color: var(--primary-color);
      font-weight: 700;
    }

    .wall-months-grid {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .wall-month {
      border: 1px solid var(--border-color);
      border-radius: 3px;
      overflow: hidden;
      background: var(--card-bg);
      width: 100%;
    }

    .wall-month-header {
      background: var(--primary-color);
      color: #f5f2eb;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-align: center;
    }

    .wall-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
    }

    .wall-weekdays span {
      padding: 7px 0;
      font-size: 0.75rem;
      font-weight: 700;
      color: #8c7f73;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .wall-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .wall-day {
      min-height: 90px;
      padding: 5px;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.75rem;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .wall-day:nth-child(7n) {
      border-right: none;
    }

    .wall-day.empty {
      background: var(--bg-color);
      opacity: 0.4;
    }

    .wall-day-num {
      font-size: 0.85rem;
      font-weight: 700;
      color: #8c7f73;
      align-self: flex-start;
      line-height: 1;
    }

    .wall-day.today .wall-day-num {
      background: var(--accent-color);
      color: #faf7f2;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
    }

    /* 🎨 Carreras en el calendario de pared */
    .wall-race {
      display: block;
      padding: 3px 6px;
      border-radius: 2px;
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.2;
      text-decoration: none;
      color: var(--primary-color);
      background: var(--pastel-none);
      border-left: 3px solid var(--pastel-none-border);
      cursor: pointer;
      transition: background 0.15s ease;
      word-break: break-word;
    }

    .wall-race:hover {
      filter: brightness(0.95);
    }

    .wall-race.only-mikel {
      background: var(--pastel-mikel);
      border-left-color: var(--pastel-mikel-border);
    }

    .wall-race.only-luken {
      background: var(--pastel-luken);
      border-left-color: var(--pastel-luken-border);
    }

    .wall-race.both {
      background: var(--pastel-both);
      border-left-color: var(--pastel-both-border);
    }

    .wall-race-who {
      display: inline-flex;
      gap: 2px;
      margin-left: 4px;
      font-size: 0.65rem;
      opacity: 0.75;
    }

    /* Estilos SVG */
    .map-container svg path, 
    .map-container svg polygon {
      fill: var(--map-base-color) !important;
      stroke: var(--map-border-color) !important;
      stroke-width: 1px !important;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      paint-order: stroke fill;
      cursor: pointer !important;
      pointer-events: visiblePainted !important;
      transition: fill 0.2s ease, stroke-width 0.2s ease;
    }

    .map-container svg g {
      fill: none;
      stroke: none;
    }

    .map-container svg path:hover, 
    .map-container svg polygon:hover {
      fill: var(--map-hover-color) !important;
      stroke-width: 2px !important;
    }

    /* Panel Fijo Lateral */
    .sidebar-fixed {
      width: var(--sidebar-width);
      height: 100%;
      background-color: var(--card-bg);
      border-left: 1px solid var(--border-color);
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      z-index: 20;
      overflow-y: auto;
    }

    .sidebar-header {
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }

    .sidebar-header h2 {
      font-size: 1.7rem;
      color: var(--primary-color);
      font-weight: 700;
      word-break: break-word;
    }

    .sidebar-content {
      color: #4a453f;
      line-height: 1.6;
      font-size: 1.05rem;
    }

    .sidebar-content h3 {
      font-size: 1.2rem;
      margin: 1.2rem 0 0.6rem 0;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .race-link {
      color: var(--accent-color);
      text-decoration: none;
      transition: color 0.2s ease;
      display: inline-block;
      font-weight: 600;
    }

    .race-link:hover {
      color: var(--instagram-color);
      text-decoration: underline;
    }

    /* 📋 Lista de años/ediciones con sangría y flecha */
    .sidebar-content ul {
      list-style: none;
      margin-left: 0;
      margin-bottom: 1rem;
      padding-left: 1.6rem;
    }

    .sidebar-content ul li {
      position: relative;
      padding-left: 1rem;
      margin-bottom: 0.25rem;
    }

    .sidebar-content ul li::before {
      content: "→";
      position: absolute;
      left: 0;
      top: 0;
      color: var(--accent-color);
      font-size: 0.8rem;
      line-height: 1.6;
      font-weight: 700;
    }

    /* 🥾 Botones Track e Instagram (misma estética, tamaño reducido) */
    .track-btn,
    .instagram-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px 3px 7px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: var(--accent-color);
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      vertical-align: middle;
      line-height: 1;
      flex-shrink: 0;
    }

    .track-btn:hover {
      background: var(--accent-color);
      color: #faf7f2;
      border-color: var(--accent-color);
      text-decoration: none;
    }

    .instagram-btn:hover {
      background: var(--instagram-color);
      color: #faf7f2;
      border-color: var(--instagram-color);
      text-decoration: none;
    }

    .track-btn img,
    .instagram-btn img {
      width: 14px;
      height: 14px;
      display: block;
      object-fit: contain;
      transition: filter 0.15s ease;
    }

    .track-btn:hover img {
      filter: brightness(0) invert(1);
    }

    /* Instagram solo logo: botón cuadrado compacto */
    .instagram-btn {
      padding: 4px;
      gap: 0;
    }

    .instagram-btn img {
      width: 16px;
      height: 16px;
    }

    /* 🗂️ Nueva tarjeta de carrera en el panel lateral */
    .race-card {
      border: 1px solid var(--border-color);
      border-radius: 3px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: var(--card-bg);
    }

    .race-card-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.6rem;
    }

    .race-card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-right: auto;
      word-break: break-word;
    }

    .race-card-latest {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: #4a453f;
      margin-bottom: 0.75rem;
    }

    .race-card-latest-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #8c7f73;
      letter-spacing: 0.3px;
    }

    .race-card-latest-date {
      font-weight: 700;
      color: var(--accent-color);
    }

    .race-card-latest-date.no-data {
      color: #a8a29a;
      font-style: italic;
      font-weight: 600;
    }

    /* Fila de acciones: Track, Datuak y Azken urteak en una línea */
    .race-card-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 0.25rem;
    }

    /* Botón desplegable (compartido por ambos menús) */
    .race-card-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent-color);
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1;
      user-select: none;
      flex-shrink: 0;
    }

    .race-card-toggle:hover {
      background: var(--bg-color);
      color: var(--primary-color);
      border-color: var(--accent-color);
    }

    .race-card-toggle .arrow {
      display: inline-block;
      font-size: 0.75rem;
      transition: transform 0.2s ease;
      transform-origin: center;
    }

    .race-card-toggle.open .arrow {
      transform: rotate(180deg);
    }

    .race-card-details {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border-color);
      display: none;
    }

    .race-card-details.open {
      display: block;
    }

    .race-card-details ul {
      list-style: none;
      margin: 0;
      padding-left: 0;
    }

    .race-card-details ul li {
      position: relative;
      padding-left: 1rem;
      margin-bottom: 0.3rem;
      font-size: 0.95rem;
    }

    .race-card-details ul li::before {
      content: "→";
      position: absolute;
      left: 0;
      top: 0;
      color: var(--accent-color);
      font-size: 0.8rem;
      line-height: 1.6;
      font-weight: 700;
    }

    .race-card-details ul li strong {
      color: var(--primary-color);
    }

    /* Datos de distancia/desnivel */
    .race-card-details .data-line {
      font-size: 0.95rem;
      margin-bottom: 0.3rem;
    }

    .race-card-details .data-line strong {
      color: var(--primary-color);
    }

    /* 🟩 Botones de marcaje M / L */
    .marcaje-box {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .marcaje-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      padding: 0;
      font-size: 0.72rem;
      font-weight: 800;
      color: #8c7f73;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
      line-height: 1;
      user-select: none;
    }

    .marcaje-btn:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .marcaje-btn.marcada[data-usuario="mikel"] {
      background: var(--pastel-mikel);
      color: #2e7d32;
      border-color: var(--pastel-mikel-border);
    }

    .marcaje-btn.marcada[data-usuario="luken"] {
      background: var(--pastel-luken);
      color: #1565c0;
      border-color: var(--pastel-luken-border);
    }

    function generarRaceId(raceName) {
      return raceName
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
    }

    async function cargarMarcajes() {
      try {
        const response = await fetch(`${JSONBIN_CONFIG.baseUrl}/${JSONBIN_CONFIG.binId}/latest`, {
          headers: { "X-Access-Key": JSONBIN_CONFIG.accessKey }
        });
        if (!response.ok) throw new Error("Error al leer");
        const data = await response.json();
        marcajes = data.record || {};
        if (!marcajes.mikel) marcajes.mikel = [];
        if (!marcajes.luken) marcajes.luken = [];
        marcajesCargados = true;
        return marcajes;
      } catch (error) {
        console.error("Error cargando marcajes:", error);
        marcajes = { mikel: [], luken: [] };
        marcajesCargados = false;
        return marcajes;
      }
    }

    async function guardarMarcajes() {
      try {
        const response = await fetch(`${JSONBIN_CONFIG.baseUrl}/${JSONBIN_CONFIG.binId}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Access-Key": JSONBIN_CONFIG.accessKey
          },
          body: JSON.stringify(marcajes)
        });
        if (!response.ok) throw new Error("Error al guardar");
        return true;
      } catch (error) {
        console.error("Error guardando marcajes:", error);
        return false;
      }
    }

    function estaMarcada(raceId, usuario) {
      return marcajes[usuario] && marcajes[usuario].includes(raceId);
    }

    async function toggleMarcaje(raceId, usuario) {
      if (!marcajes[usuario]) marcajes[usuario] = [];
      const index = marcajes[usuario].indexOf(raceId);
      if (index === -1) {
        marcajes[usuario].push(raceId);
      } else {
        marcajes[usuario].splice(index, 1);
      }
      actualizarBotonesMarcaje();
      // Refrescar calendario de pared si está visible
      if (wallCalendarContainer.style.display === 'flex') {
        renderWallCalendar(wallProvinceSelect.value, wallYearSelect.value);
      }
      await guardarMarcajes();
    }

    function actualizarBotonesMarcaje() {
      document.querySelectorAll(".marcaje-btn").forEach(btn => {

        const usuario = btn.dataset.usuario;
        if (estaMarcada(raceId, usuario)) {
          btn.classList.add("marcada");
        } else {
          btn.classList.remove("marcada");
        }
      });
    }

      btnMikel.textContent = "M";

      if (estaMarcada(raceId, "mikel")) btnMikel.classList.add("marcada");
      btnMikel.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleMarcaje(raceId, "mikel");
      });
      box.appendChild(btnMikel);

      const btnLuken = document.createElement("button");
      btnLuken.type = "button";
      btnLuken.className = "marcaje-btn";
      btnLuken.dataset.raceId = raceId;
      btnLuken.dataset.usuario = "luken";

        toggleMarcaje(raceId, "luken");

      box.appendChild(btnLuken);

      return box;
    }

    /* Extrae todas las carreras de un municipio (para la vista Zerrenda) */
    function getRacesFromTown(townData) {
      const races = [];
      if (!townData.edukia) return races;
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = townData.edukia;
      tempDiv.querySelectorAll('h3').forEach(h3 => {
        const name = h3.textContent.trim();
        if (name) races.push(name);
      });
      return races;
    }

    /* 📊 Extrae las carreras con sus fechas y datos de un municipio */
    function parseTownRaces(townData) {
      const result = [];
      if (!townData.edukia) return result;

      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = townData.edukia;

      const h3List = tempDiv.querySelectorAll('h3');
      h3List.forEach(h3 => {
        const raceName = h3.textContent.trim();
        const trackUrl = h3.getAttribute('data-track') || '';
        const instaUrl = h3.getAttribute('data-instagram') || '';
        const distantzia = h3.getAttribute('data-distantzia') || '';
        const desnibela = h3.getAttribute('data-desnibela') || '';
        const ul = h3.nextElementSibling;
        const dates = [];

        if (ul && ul.tagName.toLowerCase() === 'ul') {
          ul.querySelectorAll('li').forEach(li => {
            const text = li.innerText || li.textContent;
            const match = text.match(/(\d{4})(?:\s*\(([^)]+)\))?:\s*(.+)/);
            if (match) {
              const year = match[1];
              const edition = match[2] || '';
              const dateStr = match[3].trim();
              dates.push({ year, edition, dateStr });
            }
          });
        }

        result.push({ raceName, trackUrl, instaUrl, distantzia, desnibela, dates });
      });

      return result;
    }

    const hilabeteak = {

      "apirilak": 4, "apirila": 4,

    };

    function parseRacesFromData() {
      const races = [];
      const tempDiv = document.createElement('div');

      Object.keys(udalerriDatuak).forEach(key => {
        const townData = udalerriDatuak[key];
        if (!townData.edukia) return;

        tempDiv.innerHTML = townData.edukia;
        const h3List = tempDiv.querySelectorAll('h3');

        h3List.forEach(h3 => {
          const raceName = h3.textContent.trim();
          const ul = h3.nextElementSibling;

          if (ul && ul.tagName.toLowerCase() === 'ul') {
            const liList = ul.querySelectorAll('li');
            liList.forEach(li => {
              const text = li.innerText || li.textContent;
              const match = text.match(/(\d{4})(?:\s*\(([^)]+)\))?:\s*(.+)/);
              if (match) {
                const year = match[1];
                const edition = match[2] || '';
                const dateStr = match[3].trim();

                if (dateStr && dateStr !== '-') {
                  let day = 0;
                  let monthNum = 0;

                  const words = dateStr.toLowerCase().split(/\s+/);
                  words.forEach(w => {
                    const num = parseInt(w, 10);
                    if (!isNaN(num) && num <= 31) {
                      day = num;
                    } else if (hilabeteak[w]) {
                      monthNum = hilabeteak[w];
                    }
                  });

                  races.push({
                    townKey: key,
                    townTitle: townData.titulua,
                    townProvince: townData.province,
                    raceName: raceName,
                    year: year,
                    edition: edition,
                    dateStr: dateStr,
                    monthNum: monthNum,
                    day: day
                  });
                }
              }
            });
          }
        });
      });

      return races;
    }

    function renderCalendarGrid(filter = "", selectedYear = "2027", selectedProvince = "all") {
      calendarGrid.innerHTML = "";
      const allRaces = parseRacesFromData();

      const filteredRaces = allRaces.filter(r => {
        const matchesYear = r.year === selectedYear;
        const matchesProvince = selectedProvince === "all" || r.townProvince === selectedProvince;
        const matchesSearch = filter === "" || 
                              r.raceName.toLowerCase().includes(filter.toLowerCase()) || 
                              r.townTitle.toLowerCase().includes(filter.toLowerCase());
        return matchesYear && matchesProvince && matchesSearch;
      });

      if (filteredRaces.length === 0) {
        calendarGrid.innerHTML = `<div class="calendar-empty">Ez dago lasterketarik baieztatuta ${selectedYear} urterako.</div>`;
        return;
      }

      const racesByMonth = {};
      filteredRaces.forEach(r => {
        const m = r.monthNum || 0;
        if (!racesByMonth[m]) racesByMonth[m] = [];
        racesByMonth[m].push(r);
      });

      const sortedMonths = Object.keys(racesByMonth).map(Number).sort((a,b) => a - b);

      sortedMonths.forEach(mNum => {
        const monthBlock = document.createElement('div');
        monthBlock.className = 'month-block';

        const monthTitle = monthNames[mNum] || "Beste batzuk";
        
        let racesHtml = '';
        const mRaces = racesByMonth[mNum].sort((a,b) => a.day - b.day);

        mRaces.forEach(r => {
          const raceId = generarRaceId(r.raceName);
          racesHtml += `
            <div class="calendar-item" onclick="selectUdalerria('${r.townKey}')">
              <div class="date-badge">
                <span class="day-num">${r.day || '--'}</span>
                <span class="month-name">${monthShortNames[r.monthNum] || ''}</span>
              </div>
              <div class="race-info">
                <span class="race-title">${r.raceName} ${r.edition ? `(${r.edition})` : ''}</span>
                <div class="race-meta">
                  <span class="race-town-tag">${r.townTitle}</span>
                </div>
              </div>
              <div class="marcaje-box" data-race-id="${raceId}"></div>
            </div>
          `;
        });

        monthBlock.innerHTML = `
          <div class="month-header">${monthTitle}</div>
          <div class="month-races">${racesHtml}</div>
        `;

        calendarGrid.appendChild(monthBlock);
      });

      document.querySelectorAll('.calendar-item').forEach(item => {
        const box = item.querySelector('.marcaje-box');
        if (!box) return;
        const raceId = box.dataset.raceId;
        box.innerHTML = '';
        box.appendChild(crearBotonesMarcaje(raceId));
      });
    }

    /* ============================================ */
    /* CALENDARIO DE PARED (Egutegia)               */
    /* ============================================ */
    const wallWeekDays = ["AL", "AR", "AZ", "OG", "OL", "LA", "IG"];

    function renderWallCalendar(province = "all", year = "2027") {
      wallMonthsGrid.innerHTML = "";
      const allRaces = parseRacesFromData();

      // Filtrar por año y provincia
      const filteredRaces = allRaces.filter(r => {
        const matchesYear = r.year === year;
        const matchesProvince = province === "all" || r.townProvince === province;
        return matchesYear && matchesProvince;
      });

      // Agrupar todas las carreras por mes y día
      const byMonthDay = {};
      filteredRaces.forEach(r => {
        if (!r.monthNum || !r.day) return;
        if (!byMonthDay[r.monthNum]) byMonthDay[r.monthNum] = {};
        if (!byMonthDay[r.monthNum][r.day]) byMonthDay[r.monthNum][r.day] = [];
        const exists = byMonthDay[r.monthNum][r.day].some(x => x.raceName === r.raceName);
        if (!exists) byMonthDay[r.monthNum][r.day].push(r);
      });

      const yearNum = parseInt(year, 10);

      for (let m = 1; m <= 12; m++) {
        const monthDiv = document.createElement('div');
        monthDiv.className = 'wall-month';

        const header = document.createElement('div');
        header.className = 'wall-month-header';
        header.textContent = monthNames[m];
        monthDiv.appendChild(header);

        const weekdays = document.createElement('div');
        weekdays.className = 'wall-weekdays';
        wallWeekDays.forEach(d => {
          const span = document.createElement('span');
          span.textContent = d;
          weekdays.appendChild(span);
        });
        monthDiv.appendChild(weekdays);

        const daysDiv = document.createElement('div');
        daysDiv.className = 'wall-days';

        // Calcular primer día de la semana (lunes = 0 ... domingo = 6)
        const firstDay = new Date(yearNum, m - 1, 1);
        let firstWeekday = firstDay.getDay();
        firstWeekday = (firstWeekday + 6) % 7;

        const daysInMonth = new Date(yearNum, m, 0).getDate();

        for (let i = 0; i < firstWeekday; i++) {
          const empty = document.createElement('div');
          empty.className = 'wall-day empty';
          daysDiv.appendChild(empty);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const dayDiv = document.createElement('div');
          dayDiv.className = 'wall-day';

          const numEl = document.createElement('span');
          numEl.className = 'wall-day-num';
          numEl.textContent = d;
          dayDiv.appendChild(numEl);

          const dayRaces = byMonthDay[m] && byMonthDay[m][d];
          if (dayRaces && dayRaces.length > 0) {
            dayRaces.sort((a, b) => a.raceName.localeCompare(b.raceName));
            dayRaces.forEach(r => {
              const raceId = generarRaceId(r.raceName);
              const mikel = estaMarcada(raceId, "mikel");
              const luken = estaMarcada(raceId, "luken");

              const raceEl = document.createElement('span');
              raceEl.className = 'wall-race';

              // Colores: verde (Mikel), azul (Luken), rosa (ambos), neutro (ninguno)
              if (mikel && luken) {
                raceEl.classList.add('both');
              } else if (mikel) {
                raceEl.classList.add('only-mikel');
              } else if (luken) {
                raceEl.classList.add('only-luken');
              }

              let whoLabel = '';
              if (mikel && luken) whoLabel = 'M·L';
              else if (mikel) whoLabel = 'M';
              else if (luken) whoLabel = 'L';

              if (whoLabel) {
                raceEl.innerHTML = `${r.raceName}<span class="wall-race-who">${whoLabel}</span>`;
              } else {
                raceEl.textContent = r.raceName;
              }

              raceEl.title = `${r.raceName} — ${r.townTitle}${whoLabel ? ` (${whoLabel})` : ''}`;
              raceEl.addEventListener('click', (e) => {
                e.stopPropagation();
                selectUdalerria(r.townKey);
              });
              dayDiv.appendChild(raceEl);
            });
          }

          daysDiv.appendChild(dayDiv);
        }

        monthDiv.appendChild(daysDiv);
        wallMonthsGrid.appendChild(monthDiv);
      }
    }

    async function init() {
      await cargarMarcajes();
      renderList(searchInput.value, provinceSelect.value);
      renderCalendarGrid(searchInput.value, yearSelect.value, calendarProvinceSelect.value);
      renderWallCalendar(wallProvinceSelect.value, wallYearSelect.value);
    }

    init();

    // Toggle entre Vistas
    function setActiveButton(activeBtn) {
      [btnMap, btnList, btnData, btnWallCalendar].forEach(b => b.classList.remove('active'));
      activeBtn.classList.add('active');
    }

    btnMap.addEventListener('click', () => {
      setActiveButton(btnMap);
      mapContainer.style.display = 'flex';
      listContainer.style.display = 'none';
      calendarContainer.style.display = 'none';
      wallCalendarContainer.style.display = 'none';
    });

    btnList.addEventListener('click', () => {
      setActiveButton(btnList);
      mapContainer.style.display = 'none';
      listContainer.style.display = 'flex';
      calendarContainer.style.display = 'none';
      wallCalendarContainer.style.display = 'none';
      renderList(searchInput.value, provinceSelect.value);
    });

    btnData.addEventListener('click', () => {
      setActiveButton(btnData);
      mapContainer.style.display = 'none';
      listContainer.style.display = 'none';
      calendarContainer.style.display = 'flex';
      wallCalendarContainer.style.display = 'none';
      renderCalendarGrid(searchInput.value, yearSelect.value, calendarProvinceSelect.value);
    });

    btnWallCalendar.addEventListener('click', () => {
      setActiveButton(btnWallCalendar);
      mapContainer.style.display = 'none';
      listContainer.style.display = 'none';
      calendarContainer.style.display = 'none';
      wallCalendarContainer.style.display = 'flex';
      renderWallCalendar(wallProvinceSelect.value, wallYearSelect.value);
    });
  </script>
</body>
</html>
